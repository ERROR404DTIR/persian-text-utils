<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Persian Text Utils</title><desc id="d">Persian and Arabic letterforms are normalized into a consistent text line.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17333a"/><stop offset="1" stop-color="#0b1420"/></linearGradient><linearGradient id="g"><stop stop-color="#62e3c1"/><stop offset="1" stop-color="#a8c8ff"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g fill="url(#g)" font-family="Tahoma,Arial,sans-serif" font-size="64" text-anchor="middle"><text x="300" y="150">ي ك ة ه</text><text x="850" y="150">ی ک ۀ ه</text></g><path d="M570 80V220" stroke="#526d78" stroke-width="2" stroke-dasharray="5 8"/><path d="M90 215H1110" stroke="#36545c" stroke-width="2"><animate attributeName="stroke-dasharray" values="0 1020;1020 0" dur="4s" repeatCount="indefinite"/></path><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">PERSIAN TEXT UTILS</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">NORMALIZE / CONVERT / CLEAN</text><text x="600" y="265" text-anchor="middle" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">CONSISTENT TEXT, CLEAN OUTPUT</text></svg>